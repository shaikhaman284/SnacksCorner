version: '3.8'

services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: snackcornerdb
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_USER: root
      MYSQL_PASSWORD: rootpassword
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:mysql://db:3306/snackcornerdb
      DB_USERNAME: root
      DB_PASSWORD: rootpassword
      HIBERNATE_SHOW_SQL: "false"
      HIBERNATE_DDL_AUTO: update
    depends_on:
      - db

volumes:
  db_data:
